short_bio: >-
  <p>
    I am interested in interdisciplinary research at the intersection of
    <strong>management science</strong>,
    <strong>operations research</strong>,
    <strong>mathematical modeling</strong>,
    <strong>artificial intelligence</strong>, and
    <strong>engineering optimization</strong>.
    My research seeks to understand how mathematical, computational, and
    data-driven methods can support intelligent decision-making and optimization
    for complex systems.
  </p>

  <p>
    On the management science side, I am interested in
    <strong>contract theory, game theory, mechanism design, and resource allocation</strong>.
    On the computational side, I focus on
    <strong>scientific computing, surrogate modeling, dimensionality reduction,
    optimization algorithms, and AI-driven methods</strong>.
    These methodological perspectives provide a common foundation for studying
    both management decision problems and engineering design problems.
  </p>

  <p>
    My current engineering research focuses on
    <strong>data- and physics-informed intelligent optimization</strong>,
    particularly for turbomachinery aerodynamic design.
    Recent topics include compressor blade optimization,
    surrogate-assisted optimization, physics- and knowledge-guided optimization,
    and causal inference for understanding the relationship between
    flow-field characteristics and aerodynamic performance.
  </p>

collaboration_text: >-
  I am always interested in exchanging ideas and exploring potential collaborations
  in management science, operations research, intelligent optimization,
