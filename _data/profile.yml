short_bio_text_justify: true

short_bio: >-
  <p>
    I am an undergraduate student at
    <a href="https://www.tust.edu.cn/" target="_blank">
    Tianjin University of Science and Technology</a>.
    My current research interests lie at the intersection of
    <strong>turbomachinery aerodynamics</strong>,
    <strong>aerodynamic optimization</strong>,
    <strong>physics-informed optimization</strong>, and
    <strong>data-driven computational design</strong>.
  </p>

  <p>
    My recent research focuses on
    <strong>compressor blade aerodynamic optimization</strong>,
    with particular interests in high-dimensional and expensive black-box
    optimization problems, low-dimensional blade parameterization,
    surrogate-assisted optimization, and the integration of physical knowledge
    with data-driven optimization methods.
  </p>

  <p>
    I am also interested in developing
    <strong>physics-informed artificial intelligence</strong> methods for
    turbomachinery design, including physics-guided surrogate modeling,
    knowledge-guided optimization, and causal inference for understanding
    the relationship between flow-field characteristics and aerodynamic performance.
  </p>

  <p>
    Beyond compressor aerodynamics, I have also participated in aerodynamic
    design and numerical simulation of centrifugal and turbine fan systems,
    with experience in CFD-based performance analysis and geometric design optimization.
  </p>


