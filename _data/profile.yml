short_bio: >-
  <p>
    My research lies at the intersection of
    <strong>management science</strong>,
    <strong>operations research</strong>,
    <strong>mathematical modeling</strong>, and
    <strong>artificial intelligence</strong>.
    I am interested in understanding how mathematical, computational,
    and data-driven methods can support modeling, decision-making,
    and optimization in complex systems.
  </p>

  <p>
    My work spans both <strong>management decision-making</strong> and
    <strong>engineering optimization</strong>.
    Methodologically, I am particularly interested in
    contract theory and game-theoretic modeling,
    optimization and scientific computing,
    surrogate modeling, dimensionality reduction,
    and AI-driven computational methods.
    These tools provide a common framework for studying strategic decisions,
    resource allocation, system design, and high-dimensional optimization problems.
  </p>

  <p>
    My current research increasingly focuses on
    <strong>data- and physics-informed intelligent optimization for engineering systems</strong>.
    In particular, I study aerodynamic design and optimization of turbomachinery,
    including compressor blade optimization,
    surrogate-assisted optimization,
    physics- and knowledge-guided optimization,
    and the use of causal inference to understand the relationships between
    flow physics and aerodynamic performance.
  </p>

  <p>
    More broadly, I am interested in bridging
    <strong>management science and engineering design</strong>
    through interpretable mathematical models and intelligent computational methods,
    with the goal of developing efficient, reliable, and explainable approaches
    for complex decision and optimization problems.
  </p>


