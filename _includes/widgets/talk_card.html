{% assign talks = include.talks %}
<div class="talk-card my-3 p-0 bg-white shadow-sm rounded-sm selected-talks-card">
    <h6 class="border-bottom border-gray p-3 mb-0">
        <span class="talk-card-title"><i class="fas fa-microphone-lines"></i> Selected Talks</span>
        <a href="{{ 'talks' | relative_url }}">View all <i class="fas fa-angle-double-right"></i></a>
    </h6>
    {% for item in talks limit: 2 %}
        {% include widgets/talk_item.html item=item hide_bottom_border=forloop.last first=forloop.first last=forloop.last %}
    {% endfor %}
    <h6 class="talk-card-footer d-block p-3 mt-0 text-right">
        <a href="{{ 'talks' | relative_url }}">All talks &amp; presentations <i class="fas fa-angle-double-right"></i></a>
    </h6>
</div>
