{% assign talks = include.talks %}
<div class="my-3 p-0 bg-white shadow-sm rounded-sm selected-talks-card">
    <h6 class="border-bottom border-gray p-3 mb-0">
        <i class="fas fa-microphone-lines"></i> Selected Talks
        <a href="{{ 'talks' | relative_url }}">(view all <i class="fas fa-angle-double-right"></i>)</a>
    </h6>
    {% for item in talks limit: 2 %}
        {% include widgets/talk_item.html item=item %}
    {% endfor %}
    <h6 class="d-block p-3 mt-0 text-right">
        <a href="{{ 'talks' | relative_url }}">All talks &amp; presentations <i class="fas fa-angle-double-right"></i></a>
    </h6>
</div>
